<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{person.name}}</title>
</head>
<body>
  <h1>{{ person.name }}</h1>
  <ul>
    <li>Nombre: {{ person.name }}</li>
    <li>Apellido: {{ person.last_name }}</li>
    <li>Talla polo: {{ person.shirt_sizes }}</li>
    <li>Pareja: {{ person.partner.name }}</li>
    <li>Pais: {{ person.country.name }}</li>
  </ul>
  <a href="{% url 'playground:person-list' %}">Volver a lista</a>
</body>
</html>
