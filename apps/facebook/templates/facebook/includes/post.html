{% load static %}

<div class="col d-flex">
  <div class="card p-0">
    <div class="row g-0 h-100">
      <div class="col-md-4">
        <div class="{% if not is_user_detail %}img-post-container{% endif %} h-100 position-relative">
          <a href="{% url 'facebook:detail-user' pk=post.user.id %}" class="img-post-profile position-absolute bottom-0 start-0 d-flex align-items-center justify-content-center p-3 text-decoration-none" title="{{ post.user.username }}"><img src="{% static 'facebook/img/anonymous_user.webp' %}" alt="mdo" width="50" height="50" class="rounded-circle object-fit-cover"/></a>
          <img src="{% static 'facebook/img/post_img_default.webp' %}" class="img-fluid rounded-start w-100 h-100 object-fit-cover" alt="Card title" />
        </div>
      </div>
      <div class="col-md-8">
        <div class="card-body">
          <h5 class="card-title">{{ post.title }}</h5>
          <p class="card-text">{{ post.body }}</p>
          <p class="m-0">
            <i class="bi bi-hand-thumbs-up-fill"></i> <span class="fw-bold">Likes:</span> {{ post.quantity_likes }}
          </p>
          {% if not is_user_detail %}
            <a href="{% url 'facebook:detail-user' pk=post.user.pk %}">{{ post.user.username }} ({{ post.user.quantity_followers }} seguidores)</a>
          {% endif %}
          <p class="card-text">
            <small class="text-body-secondary"><time datetime="{{ post.created_at|date:'c' }}">{{ post.created_at|date:'d/m/Y H:i' }}</time></small>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
