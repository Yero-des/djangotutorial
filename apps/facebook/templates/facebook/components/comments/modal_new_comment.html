<form class="container-sm p-0 new-comment-form" action="{% url 'facebook:create-comment' post.id %}" method="post">
  {% csrf_token %}
  <div class="row g-0 gap-2">
    <div class="col-auto">
      {% if request.user.photo %}
        <img src="{{ request.user.photo.url }}" alt="mdo" class="img-user-post rounded-circle object-fit-cover" />
      {% else %}
        <div class="img-user-post bg-body-tertiary d-flex justify-content-center align-items-center rounded-circle text-decoration-none border text-body">
          <i class="bi bi-person"></i>
        </div>
      {% endif %}
    </div>
    <div class="col new-comment-input">
      <div class="input-group">
        <textarea name="comment" id="newCommentUser-{{ post.id }}" placeholder="Comentar como {{ request.user }}" class="form-control" required></textarea>
        <button type="submit" class="btn btn-primary" aria-label="Enviar comentario"><i class="bi bi-send"></i></button>
      </div>
    </div>
  </div>
</form>
