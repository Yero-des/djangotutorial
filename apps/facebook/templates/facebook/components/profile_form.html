<form action="" method="post" enctype="multipart/form-data">
  {% csrf_token %}

  {% for field in form %}
    <div class="mb-3">
      {% if field.name != 'photo' %}
        {{ field.label_tag }}
      {% endif %}
      {{ field }}

      {% if field.errors %}
        <ul class="invalid-feedback invalid-feedback-custom">
          {% for error in field.errors %}
            <li>{{ error }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    </div>
  {% endfor %}

  <button type="submit" class="btn btn-warning">Actualizar perfil</button>
</form>
