{% load static %}

<div class="col d-flex">
  <div class="card p-0">
    {% comment %}TODO: Implementar vista de post por un modal{% endcomment %}
    <div class="row g-0 h-100">
      <div class="col-md-4">
        <div class="img-post-container h-100 position-relative">
          {% if not is_user_detail %}
            <a href="{% url 'facebook:detail-user' pk=post.user.id %}" class="img-post-profile position-absolute bottom-0 start-0 d-flex align-items-center justify-content-center p-3 text-decoration-none" title="{{ post.user.username }}">
              <div class="position-relative">
                <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                  <i class="bi bi-person"></i> {{ post.user.quantity_followers }}
                  <span class="visually-hidden">Seguidores</span>
                </span>
                <img src="{{ post.user.photo_url }}" alt="mdo" width="50" height="50" class="rounded-circle object-fit-cover" />
              </div>
            </a>
          {% endif %}
          <img src="{% static 'facebook/img/post_img_default.webp' %}" class="img-fluid rounded-start w-100 h-100 object-fit-cover" alt="Card title" />
        </div>
      </div>
      <div class="col-md-8">
        <div class="card-body">
          <h5 class="card-title">{{ post.title }}</h5>
          <p class="card-text">{{ post.content }}</p>
          <p class="m-0">
            <button id="btn-like-post-{{ post.id }}" data-url="{% url 'facebook:like-post' post.id %}" data-csrf="{{ csrf_token }}" onclick="likePost(this)" class="btn p-0 btn-like-inner-post {% if post.is_liked %}liked{% endif %}">
              <i class="bi bi-hand-thumbs-up"></i>
              <span>{{ post.quantity_likes }}</span>
            </button>
          </p>
          <p class="card-text">
            <small class="text-body-secondary"><time datetime="{{ post.created_at|date:'c' }}">{{ post.created_at|date:'d/m/Y H:i' }}</time></small>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
