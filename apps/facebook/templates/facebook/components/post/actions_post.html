<div class="row justify-content-end">
  <div class="col-auto d-flex gap-2 post-options">
    <a href="{% url 'facebook:edit-post' pk=post.id %}" class="edit-post btn p-0"><i class="bi bi-pencil-square fs-6"></i></a>
    <form class="delete-post-form" action="{% url 'facebook:delete-post' pk=post.id %}" method="post">
      {% csrf_token %}
      <button type="submit" class="delete-post btn p-0"><i class="bi bi-trash-fill fs-6"></i></button>
    </form>
  </div>
</div>
