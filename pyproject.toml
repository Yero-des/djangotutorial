    "parso==0.8.7",
    "prompt-toolkit==3.0.53",
    "psutil==7.2.2",
    "psycopg2==2.9.13",
    "pure-eval==0.2.3",
    "pygments==2.21.0",
    "python-dotenv==1.2.3",
    "sqlparse==0.6.0",
    "stack-data==0.6.3",
    "traitlets==5.16.1",
    "tzdata==2026.3",
    "wcwidth==0.8.2",
