{% extends 'base.html' %}
{% load static %}

{% block styles %}
  <link rel="stylesheet" href="{% static 'facebook/css/facebook_styles.css' %}" />
{% endblock %}

{% block content %}
  <main class="d-flex flex-nowrap">
    {% include './includes/sidebar.html' with active=current_view %}

    <section class="overflow-y-auto w-100">
      {% comment %} <img src="{% static 'facebook/img/facebook_background.webp' %}" alt="Imagen de fondo para contenido" class="w-100" styles="height: 5rem;" /> {% endcomment %}

      <div class="container mt-5">
        {% block page_content %}

        {% endblock %}
      </div>
    </section>
  </main>
{% endblock %}

{% block scripts %}
  <script src="{% static 'facebook/js/sidebar.js' %}"></script>
{% endblock %}
